spring.application.name=eval

# Chemin du fichier base de donnees SQLite (cree automatiquement au demarrage).
# "kanban.db" => fichier eval/kanban.db (relatif au dossier ou on lance l'appli).
# Pour le placer ailleurs, mettre un chemin complet, ex:
#   kanban.db.path=C:/Users/Lapatia/kanban.db
kanban.db.path=kanban.db

# JPA / Hibernate sur le meme fichier SQLite. ddl-auto=update cree/complete les
# tables automatiquement au demarrage.
spring.datasource.url=jdbc:sqlite:${kanban.db.path:kanban.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false
